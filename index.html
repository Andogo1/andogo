<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at 20% 20%, #ff5f9e55, transparent 30%),
                radial-gradient(circle at 80% 80%, #7b61ff55, transparent 30%),
                linear-gradient(135deg, #12001f, #250044, #08001a);
        }

        /* მოძრავი ნათებები */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(80px);
            animation: move 6s infinite alternate ease-in-out;
        }

        body::before {
            background: #ff3b8d;
            top: -100px;
            left: -100px;
        }

        body::after {
            background: #643cff;
            bottom: -100px;
            right: -100px;
            animation-delay: 2s;
        }

        @keyframes move {
            from {
                transform: translate(0, 0) scale(1);
            }
            to {
                transform: translate(100px, 60px) scale(1.3);
            }
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        button {
            border: none;
            padding: 20px 50px;
            border-radius: 50px;
            font-size: 28px;
            font-weight: bold;
            color: white;
            cursor: pointer;

            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);

            box-shadow:
                0 0 20px #ff4f9a,
                inset 0 0 20px rgba(255,255,255,0.1);

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow:
                0 0 40px #ff4f9a,
                0 0 80px #7b61ff;
        }

        #message {
            display: none;
            color: white;
            font-size: 42px;
            font-weight: bold;

            animation: appear 1s ease forwards;

            text-shadow:
                0 0 10px #fff,
                0 0 25px #ff4f9a,
                0 0 50px #7b61ff;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .heart {
            position: absolute;
            color: #ff72ad;
            font-size: 25px;
            animation: float 5s linear infinite;
            opacity: 0.8;
        }

        @keyframes float {
            from {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            to {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <button id="button" onclick="showMessage()">
            დაჭირე!! ❤️
        </button>

        <div id="message">
            რავახართ გოგა და ანა :D 
        </div>

    </div>

    <script>
        function showMessage() {
            document.getElementById("button").style.display = "none";
            document.getElementById("message").style.display = "block";

            // გულები
            for (let i = 0; i < 25; i++) {
                let heart = document.createElement("div");
                heart.className = "heart";
                heart.innerHTML = "❤️";
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.animationDuration = (3 + Math.random() * 4) + "s";
                heart.style.animationDelay = Math.random() * 2 + "s";

                document.body.appendChild(heart);
            }
        }
    </script>

</body>
</html>
