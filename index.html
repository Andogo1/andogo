<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Goga, Gio & Data — Star Dash</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        ✦ STAR DASH
    </div>

    <div class="stats">

        <span>
            ⭐ <b id="score">0</b>
        </span>

        <span>
            ❤️ <b id="lives">3</b>
        </span>

    </div>

</header>


<!-- START SCREEN -->

<section id="startScreen" class="screen active">

    <div class="menu">

        <div class="bigIcon">
            🌙✨
        </div>

        <h1>
            Goga, Gio & Data
        </h1>

        <h2>
            STAR DASH
        </h2>

        <p>
            შეაგროვე რაც შეიძლება მეტი ⭐ ვარსკვლავი
            და აარიდე თავი ☄️ მეტეორებს!
        </p>


        <!-- CHARACTERS -->

        <div class="characters">

            <button
                class="character selected"
                data-character="goga"
                type="button"
            >

                <div class="avatar goga">
                    G
                </div>

                <span>
                    გოგა
                </span>

            </button>


            <button
                class="character"
                data-character="gio"
                type="button"
            >

                <div class="avatar gio">
                    G
                </div>

                <span>
                    გიო
                </span>

            </button>


            <button
                class="character"
                data-character="data"
                type="button"
            >

                <div class="avatar data">
                    D
                </div>

                <span>
                    დათა
                </span>

            </button>

        </div>


        <!-- START -->

        <button
            id="startBtn"
            class="startButton"
            type="button"
        >
            დაწყება 🚀
        </button>


        <div class="controls">
            მოძრაობა: A / D ან ა / დ
        </div>

    </div>

</section>



<!-- GAME SCREEN -->

<section
    id="gameScreen"
    class="screen gameScreen"
>

    <canvas
        id="game"
        width="900"
        height="520"
    ></canvas>


    <!-- MOBILE -->

    <div class="mobileControls">

        <button
            id="leftBtn"
            type="button"
        >
            ◀
        </button>

        <button
            id="rightBtn"
            type="button"
        >
            ▶
        </button>

    </div>

</section>



<!-- END SCREEN -->

<section
    id="endScreen"
    class="screen"
>

    <div class="menu">

        <div
            id="resultIcon"
            class="bigIcon"
        >
            🏆
        </div>


        <h1 id="resultTitle">
            ვაუ!
        </h1>


        <p id="resultText"></p>


        <div class="finalScore">

            ⭐
            <span id="finalScore">
                0
            </span>

        </div>


        <button
            id="againBtn"
            class="startButton"
            type="button"
        >
            თავიდან 🔄
        </button>

    </div>

</section>


<script src="script.js"></script>

</body>
</html>
